<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backup Brain</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.4.0/purify.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/firacode@6.2.0/distr/fira_code.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid chat-container">
        <div class="row h-100">
            <div class="col-md-2 sidebar">
                <div class="model-selection">
                    <h4 class="mb-4">AI Models</h4>
                    <div class="list-group" id="model-list">
                        <a href="#" class="list-group-item" data-model="openrouter/openai/gpt-3.5-turbo">
                            <i class="fas fa-robot"></i> GPT-3.5 Turbo
                        </a>
                        <a href="#" class="list-group-item" data-model="openrouter/anthropic/claude-2">
                            <i class="fas fa-brain"></i> Claude 2
                        </a>
                        <a href="#" class="list-group-item" data-model="openrouter/google/palm-2-chat-bison">
                            <i class="fas fa-code"></i> Gemini
                        </a>
                    </div>
                </div>
                <div class="history-section mt-4">
                    <h4 class="mb-4">History</h4>
                    <div class="list-group" id="history-list">
                        <!-- Session IDs will be dynamically added here -->
                    </div>
                </div>
            </div>
            <div class="col-md-10 chat-interface d-flex flex-column">
                <div class="card flex-grow-1">
                    <div class="card-header">
                        <h5 class="mb-0">Backup Brain</h5>
                        <div id="connection-status">
                            <i class="fas fa-circle"></i> Disconnected
                        </div>
                    </div>
                    <div class="chat-messages flex-grow-1" id="chat-messages"></div>
                </div>
                <div class="total-cost-container">
                    <span class="total-cost-label">Session Total:</span>
                    <span id="total-cost" class="total-cost-value">$0.0000</span>
                </div>
                <div class="input-group mt-auto">
                    <textarea id="message-input" class="form-control" placeholder="Type your message..." disabled></textarea>
                    <button id="send-btn" class="btn btn-primary" disabled>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- New Session Confirmation Modal -->
    <div class="modal fade" id="irrelevantContentModal" tabindex="-1" role="dialog" aria-labelledby="irrelevantContentModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="irrelevantContentModalLabel">Start New Session</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    The current conversation seems to have become irrelevant. Would you like to start a new session?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Continue Current Session</button>
                    <button type="button" class="btn btn-primary" id="startNewSessionBtn">Start New Session</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
