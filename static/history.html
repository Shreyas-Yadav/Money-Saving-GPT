<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat History</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/firacode@6.2.0/distr/fira_code.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.4.0/purify.min.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --background-color: #ecf0f1;
            --chat-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f6f8f9 0%, #e5ebee 100%);
            color: var(--text-color);
            line-height: 1.6;
        }

        .chat-container {
            height: 100vh;
            padding: 20px;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: none;
            height: 100%;
        }

        .card-header {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-messages {
            overflow-y: auto;
            padding: 20px;
            background-color: var(--chat-bg);
            height: calc(100% - 60px);
        }

        .message {
            margin-bottom: 20px;
            max-width: 80%;
            width: fit-content;
            position: relative;
        }

        .message.user {
            margin-left: auto;
        }

        .message.assistant {
            margin-right: auto;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 1.25em;
            line-height: 1.4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.user .message-content {
            background: var(--accent-color);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: floralwhite;
            border: 1px solid rgba(0,0,0,0.05);
            border-bottom-left-radius: 4px;
        }

        .message.user .message-content::after {
            content: '';
            position: absolute;
            right: -8px;
            bottom: 8px;
            border: 8px solid transparent;
            border-left-color: var(--accent-color);
        }

        .message.assistant .message-content::before {
            content: '';
            position: absolute;
            left: -8px;
            bottom: 8px;
            border: 8px solid transparent;
            border-right-color: floralwhite;
        }

        .message.assistant .message-content pre {
            background: rgba(0,0,0,0.03);
            border-left: 3px solid var(--accent-color);
            padding: 1em;
            margin: 0.8em 0;
            border-radius: 6px;
            overflow-x: auto;
        }

        .message.assistant .message-content code {
            font-family: 'Fira Code', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
            color: brown;
        }

        .cost-badge {
            font-size: 0.8em;
            color: #27ae60;
            background: rgba(39, 174, 96, 0.1);
            padding: 4px 8px;
            border-radius: 12px;
            margin: 5px 0 15px;
            width: fit-content;
        }

        .back-button {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container-fluid chat-container">
        <div class="row h-100">
            <div class="col-md-12 chat-interface d-flex flex-column">
                <div class="card flex-grow-1">
                    <div class="card-header">
                        <h5 class="mb-0">Chat History</h5>
                        <div class="card-header-content">
                            <button id="generate-summary-btn" class="btn btn-sm btn-outline-light">
                                <i class="fas fa-file-alt mr-1"></i>Generate Summary
                            </button>
                            <a href="/" class="back-button">
                                <i class="fas fa-arrow-left"></i>
                                Back to Chat
                            </a>
                        </div>
                    </div>
                    <div class="chat-messages" id="chat-messages">
                        <!-- Chat history will be dynamically added here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Summary Modal -->
    <div class="modal fade" id="summaryModal" tabindex="-1" role="dialog" aria-labelledby="summaryModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
            <div class="modal-content" style="background-color: var(--chat-bg); color: var(--text-color);">
                <div class="modal-header" style="background: linear-gradient(45deg, var(--primary-color), var(--secondary-color)); color: white;">
                    <h5 class="modal-title" id="summaryModalLabel">Chat Summary</h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="summaryModalBody">
                    <!-- Summary will be dynamically inserted here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000';
        const chatMessages = document.getElementById('chat-messages');
        const generateSummaryBtn = document.getElementById('generate-summary-btn');
        const summaryModalBody = document.getElementById('summaryModalBody');

        async function fetchChatHistory(sessionId) {
            try {
                const response = await fetch(`${API_BASE_URL}/get_chat_history/${sessionId}`);
                const data = await response.json();
                data.forEach(message => {
                    const messageContainer = document.createElement('div');
                    messageContainer.classList.add('message', message.role);
                    
                    const contentDiv = document.createElement('div');
                    contentDiv.classList.add('message-content');
                    
                    if (message.role === 'assistant') {
                        contentDiv.innerHTML = DOMPurify.sanitize(marked.parse(message.content));
                    } else {
                        contentDiv.textContent = message.content;
                    }
                    
                    messageContainer.appendChild(contentDiv);
                    chatMessages.appendChild(messageContainer);
                });
            } catch (error) {
                console.error('Error fetching chat history:', error);
            }
        }

        // Extract session ID from URL
        const sessionId = window.location.pathname.split('/').pop();
        fetchChatHistory(sessionId);

        // Add event listener for summary generation
        generateSummaryBtn.addEventListener('click', async () => {
            try {
                const response = await fetch(`${API_BASE_URL}/generate_summary/${sessionId}`);
                const data = await response.json();
                
                // Display summary in modal
                summaryModalBody.innerHTML = `
                    <div class="summary-content" style="white-space: pre-wrap; line-height: 1.6;">
                        ${DOMPurify.sanitize(marked.parse(data.summary))}
                    </div>
                `;
                
                // Show the modal
                $('#summaryModal').modal('show');
            } catch (error) {
                console.error('Error generating summary:', error);
                summaryModalBody.innerHTML = `<p class="text-danger">Failed to generate summary. Please try again.</p>`;
                $('#summaryModal').modal('show');
            }
        });
    </script>
</body>
</html>
