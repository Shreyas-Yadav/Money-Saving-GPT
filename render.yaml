services:
  - type: web
    name: backup-brain
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.7
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false